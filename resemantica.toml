[llm]
base_url = "http://127.0.0.1:8033"
timeout_seconds = 1800
max_retries = 3
context_window = 65000
max_concurrent_requests_per_model = 1

[llm.throttle_groups.qwen]
model_names = ["Qwen3.5-9B-GLM5.1", "Qwen3.5-9B-NonThinking-unsloth"]
max_concurrent_requests = 1
system_prompt = "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."

[models]
translator_name = "HY-MT1.5-7B"
preprocess_translator_names = [
  "HY-MT1.5-7B",
  "Qwen3.5-9B-GLM5.1",
]
# translator_context_window = 65000
# translator_max_context_ratio = 0.75
analyst_name = "Qwen3.5-9B-GLM5.1"
# analyst_context_window = 240000
# analyst_max_context_ratio = 0.75
eval_name = "Qwen3.5-9B-NonThinking-unsloth"
embedding_name = "BAAI/bge-m3"
pruning_threshold = 0.3

[paths]
artifact_root = "artifacts"
db_filename = "resemantica.db"

[budget]
max_context_per_pass = 49152
max_paragraph_chars = 2000
max_bundle_bytes = 4096
degrade_order = ["broad_continuity", "fuzzy_candidates", "rerank_depth", "pass3", "fallback_model"]

[translation]
pass3_default = false
risk_threshold_high = 0.7
batched_model_order = true
pass2_concurrency = 3

[batch_order]
enabled = true
summary_chunk_multiplier = 10
translation_chunk_size = 10

[summaries]
exclude_chapter_patterns = ["titlepage", "nav\\.xhtml", "toc", "book.?2", "front.?matter", "ver-page", "Introdution", "cover", "copyright"]
chapter_concurrency = 1
story_compact_max_tokens = 2048
